<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News Recommendation System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">News Recommender</a>

    <button id="themeToggle" class="btn btn-outline-light ms-auto">
      🌙 Dark Mode
    </button>
  </div>
</nav>


    <div class="container mt-4">
        <div class="row mb-4">
            <div class="col">
                <h4>Select Category</h4>
                <select class="form-select" id="categorySelect">
                    <option value="">All Categories</option>
                </select>
            </div>
        </div>

        <div class="row mb-4">
            <div class="col">
                <div class="input-group">
                    <input type="text" class="form-control" id="searchQuery"
                           placeholder="Enter keywords or paste an article...">
                    <button class="btn btn-primary" type="button" id="searchButton">Get Recommendations</button>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-md-6">
                <h4>Recommended Articles</h4>
                <div id="recommendations"></div>
            </div>

            <div class="col-md-6">
                <h4>Random Articles</h4>
                <div id="randomArticles" class="row"></div>
            </div>
        </div>
    </div>
    <script>
document.addEventListener("DOMContentLoaded", function() {
    const toggleButton = document.getElementById("themeToggle");
    const body = document.body;

    // Load saved theme
    const savedTheme = localStorage.getItem("theme");
    if (savedTheme === "dark") {
        body.classList.add("dark-mode");
        toggleButton.textContent = "☀️ Light Mode";
    }

    // Toggle on click
    toggleButton.addEventListener("click", function() {
        body.classList.toggle("dark-mode");
        const isDark = body.classList.contains("dark-mode");
        toggleButton.textContent = isDark ? "☀️ Light Mode" : "🌙 Dark Mode";
        localStorage.setItem("theme", isDark ? "dark" : "light");
    });
});
</script>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='main.js') }}"></script>
</body>
</html>
